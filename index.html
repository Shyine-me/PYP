<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="6;url=https://shyine.me/resources">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus on Studies!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0fc2c0, #3b3f92);
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
      text-align: center;
      overflow: hidden;
      padding: 20px;
    }
    h1 {
      font-size: 6vw; /* Responsive font size */
      max-width: 90%;
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      animation: fadeIn 2s ease-in-out;
      line-height: 1.4;
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Improve readability for very small screens */
    @media (max-width: 500px) {
      h1 {
        font-size: 7vw;
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <h1>
    Nikita se dhyaan hatao!<br>
    Padhai pe dhyan do 😜<br>
    Ye lo free previous year papers!! 🎁
  </h1>

  <script>
    // Backup JavaScript redirect
    setTimeout(function() {
      window.location.href = "https://shyine.me/resources";
    }, 4500);
  </script>
</body>
</html>
